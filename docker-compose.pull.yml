services:
  rabbitmq:
    image: rabbitmq:4.3.6-management

    environment:
      RABBITMQ_DEFAULT_USER: ${RabbitMq__Username}
      RABBITMQ_DEFAULT_PASS: ${RabbitMq__Password}

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: hoaikhoitran/smartsolar-api:latest

    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      RabbitMq__Host: rabbitmq
      RabbitMq__Port: 5672

      Redis__Enabled: true
      Redis__ConnectionString: redis:6379
      Redis__InstanceName: "SmartSolar:"

      Rag__ServiceBaseUrl: http://rag-service:8000

    ports:
      - "8080:8080"

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Internal RAG service (FastAPI). No published port: only the API reaches it, on the
  # compose network, and every call is HMAC-signed. Started with `--profile rag`.
  # It deliberately does not read .env wholesale (least privilege): only RAG_* values.
  rag-service:
    image: ${RAG_IMAGE:-hoaikhoitran/smartsolar-rag-service}:${RAG_IMAGE_TAG:-latest}
    profiles: ["rag"]
    environment:
      RAG_ENV: ${RAG_ENV:-development}
      RAG_SHARED_SECRET: ${RAG_SHARED_SECRET:-}
      RAG_VECTOR_STORE: ${RAG_VECTOR_STORE:-memory}
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      RAG_STORAGE: ${RAG_STORAGE:-s3}
      RAG_S3_REGION: ${RAG_S3_REGION:-ap-southeast-1}
      RAG_S3_ALLOWED_BUCKETS: ${RAG_S3_ALLOWED_BUCKETS:-}
      AWS_ACCESS_KEY_ID: ${RAG_AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${RAG_AWS_SECRET_ACCESS_KEY:-}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-hashing}
      # Empty = the provider default (text-embedding-3-small for openai, hashing-dev for hashing).
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RAG_EMBEDDING_DIMENSION: ${RAG_EMBEDDING_DIMENSION:-1536}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_LLM_PROVIDER: ${RAG_LLM_PROVIDER:-extractive}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-extractive-dev}
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
      RAG_WORKERS: ${RAG_WORKERS:-1}
      RAG_INGEST_DEADLINE_SECONDS: ${RAG_INGEST_DEADLINE_SECONDS:-270}

    expose:
      - "8000"

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  rabbitmq_data: